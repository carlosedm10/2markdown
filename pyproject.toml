[project]
name = "twomarkdown"
version = "0.1.0"
description = "Batch convert folders to markdown using MarkItDown with local OCR"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "markitdown[all]>=0.1.5",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.13",
    "pydantic-ai>=1.52.0",
    "pydantic-settings>=2.7.0",
    "typer>=0.15.0",
    "pillow>=11.0.0",
    "requests>=2.32.0",
    "tqdm>=4.67.3",
    "numbers-parser>=4.18",
    "keynote-parser>=1.14",
    "ebooklib>=0.20",
    "markdownify>=0.13.0",
    "mobi>=0.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
iwork-kreuzberg = [
    "kreuzberg>=0.1.0",
]

[project.scripts]
twomarkdown = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
addopts = "-ra"
markers = [
    "integration: marks tests that need markitdown/tesseract (deselect with '-m not integration')",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
