name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # CI-shaped bootstrap: no Compose stack on the runner; Makefile uses native uv when CI=true.
      - name: Install dependencies
        run: make sync-ci

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install tesseract
        run: make tesseract-ci

      - name: Install dependencies
        run: make sync-ci

      - name: Integration tests
        run: make test-integration
